<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 30" width="145" height="30" fill="none" role="img" aria-label="Projects"><style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.3s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.flow{stroke-dasharray:3 6;animation:flow 1.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.wave{transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.draw,.flow,.wave,.ring{animation:none}.rise{opacity:1}.draw{stroke-dashoffset:0}.ring{opacity:0}}
</style><defs><linearGradient id="accent-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#e879f9"/></linearGradient><linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient></defs><rect x=".5" y=".5" width="144" height="29" stroke="#d1d9e0"/><svg x="13.0" y="8.0" width="14" height="14" viewBox="0 0 24 24"><path fill="#4285f4" d="M12 0C8.21 0 4.831 1.757 2.632 4.501l3.953 6.848A5.454 5.454 0 0 1 12 6.545h10.691A12 12 0 0 0 12 0zM1.931 5.47A11.943 11.943 0 0 0 0 12c0 6.012 4.42 10.991 10.189 11.864l3.953-6.847a5.45 5.45 0 0 1-6.865-2.29zm13.342 2.166a5.446 5.446 0 0 1 1.45 7.09l.002.001h-.002l-5.344 9.257c.206.01.413.016.621.016 6.627 0 12-5.373 12-12 0-1.54-.29-3.011-.818-4.364zM12 16.364a4.364 4.364 0 1 1 0-8.728 4.364 4.364 0 0 1 0 8.728Z"/></svg><text class="mono" x="36.0" y="19.0" font-size="11" fill="#1f2328" letter-spacing="2">PROJECTS</text><path d="M121 20l8-8m-6 0h6v6" stroke="url(#accent-light)" stroke-width="1.5"/></svg>
